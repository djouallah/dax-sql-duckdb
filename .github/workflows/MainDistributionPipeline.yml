#
# Builds the extension with DuckDB's distribution pipeline. The tests run in the Test workflow,
# against the binaries this one uploads, so a change to the tests needs no build.
#
name: Main Extension Distribution Pipeline
on:
  push:
    paths-ignore: ['test/**', '**.md', '.github/workflows/test.yml', '.github/scripts/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.1
      ci_tools_version: v2.0-cyanoptera
      extension_name: dax_sql
      # linux_amd64 only, with no tests here (the Test workflow runs them on its binary), until the
      # repository variable FULL_CI is 'true'. Then as community-extensions builds a submission:
      # every platform extension-ci-tools builds, and the sqllogictests run in the build, in DuckDB's
      # own test runner. A platform that cannot build goes in the descriptor's excluded_platforms.
      # No wasm at all: DuckDB-Wasm has no azure extension, so it cannot read OneLake (abfss://),
      # which is what the extension is for; the descriptor's excluded_platforms says the same.
      exclude_archs: ${{ vars.FULL_CI == 'true' && 'wasm_mvp;wasm_eh;wasm_threads' || 'wasm_mvp;wasm_threads;wasm_eh;linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_arm64;windows_amd64;windows_amd64_mingw' }}
      skip_tests: ${{ vars.FULL_CI != 'true' }}

  code-quality-check:
    name: Code Quality Check
    if: vars.FULL_CI == 'true'
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.1
      ci_tools_version: v2.0-cyanoptera
      extension_name: dax_sql
      format_checks: 'format'
